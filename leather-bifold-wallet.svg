      <!-- Card Slot flap -->
      <path d="M 140 145 C 170 145 180 135 200 135 C 220 135 230 145 260 145" fill="none" stroke="#451a03" stroke-width="2"/>
      <rect x="180" y="125" width="35" height="15" rx="2" fill="#92400e"/>
      <circle cx="240" cy="165" r="4" fill="#fbbf24"/>
    
  <!-- Text Label -->
  <text x="200" y="228" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">Leather Bifold Wallet</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="13" fill="#718096" text-anchor="middle">Accessories</text>
