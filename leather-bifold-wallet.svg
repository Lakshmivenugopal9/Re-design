<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0f2f5" stroke="#cccccc" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
  
      <!-- Wallet Opened Folded Perspective -->
      <rect x="140" y="110" width="120" height="80" rx="8" fill="#78350f" stroke="#451a03" stroke-width="3"/>
