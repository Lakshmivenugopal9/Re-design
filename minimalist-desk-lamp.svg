<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0f2f5" stroke="#cccccc" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
  
      <!-- Base -->
      <rect x="145" y="195" width="80" height="10" rx="3" fill="#334155"/>
      <!-- Vertical Stem -->
      <line x1="170" y1="195" x2="170" y2="90" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <!-- Angled Arm -->
      <line x1="170" y1="90" x2="235" y2="85" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <!-- Lamp Head -->
      <polygon points="225,85 250,75 255,105 225,100" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
      <!-- Light Glow -->
      <polygon points="230,105 260,105 285,185 210,185" fill="#fef08a" opacity="0.3"/>
    
  <!-- Text Label -->
  <text x="200" y="228" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">Minimalist Desk Lamp</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="13" fill="#718096" text-anchor="middle">Home</text>
</svg>