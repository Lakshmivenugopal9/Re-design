<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0f2f5" stroke="#cccccc" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
  
      <!-- Mug Body -->
      <rect x="150" y="105" width="80" height="90" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
      <!-- Mug Handle -->
      <path d="M 230 120 C 265 120 265 175 230 175" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
      <path d="M 230 120 C 265 120 265 175 230 175" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
      <!-- Coffee/Steam lines -->
      <path d="M 170 95 Q 175 85 170 75" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 190 95 Q 195 82 190 70" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 210 95 Q 215 85 210 75" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Decorative graphic on mug -->
      <circle cx="190" cy="150" r="14" fill="#0284c7"/>
    
  <!-- Text Label -->
  <text x="200" y="228" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">Ceramic Coffee Mug</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="13" fill="#718096" text-anchor="middle">Home</text>
</svg>