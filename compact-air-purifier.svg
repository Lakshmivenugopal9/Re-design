<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0f2f5" stroke="#cccccc" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
  
      <!-- Purifier Body -->
      <rect x="155" y="85" width="90" height="120" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
      <!-- Air Grill dots -->
      <g fill="#94a3b8">
        <circle cx="175" cy="150" r="3"/><circle cx="190" cy="150" r="3"/><circle cx="205" cy="150" r="3"/><circle cx="220" cy="150" r="3"/>
        <circle cx="175" cy="165" r="3"/><circle cx="190" cy="165" r="3"/><circle cx="205" cy="165" r="3"/><circle cx="220" cy="165" r="3"/>
        <circle cx="175" cy="180" r="3"/><circle cx="190" cy="180" r="3"/><circle cx="205" cy="180" r="3"/><circle cx="220" cy="180" r="3"/>
      </g>
      <!-- Top control ring -->
      <circle cx="200" cy="115" r="14" fill="none" stroke="#0ea5e9" stroke-width="3"/>
      <circle cx="200" cy="115" r="6" fill="#0ea5e9"/>
    
  <!-- Text Label -->
  <text x="200" y="228" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">Compact Air Purifier</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="13" fill="#718096" text-anchor="middle">Lifestyle</text>
</svg>