<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0f2f5" stroke="#cccccc" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
  
      <!-- Shelf Frame -->
      <rect x="145" y="70" width="110" height="135" rx="2" fill="none" stroke="#475569" stroke-width="4"/>
      <!-- Horizontal shelves -->
      <line x1="145" y1="115" x2="255" y2="115" stroke="#475569" stroke-width="4"/>
      <line x1="145" y1="160" x2="255" y2="160" stroke="#475569" stroke-width="4"/>
      <!-- Books on Top Shelf -->
      <rect x="155" y="85" width="8" height="28" fill="#ef4444"/>
      <rect x="165" y="80" width="10" height="33" fill="#3b82f6"/>
      <rect x="177" y="88" width="7" height="25" fill="#10b981"/>
      <circle cx="230" cy="102" r="10" fill="#f59e0b"/>
      <!-- Books on Mid Shelf -->
      <rect x="195" y="125" width="12" height="33" fill="#8b5cf6"/>
      <rect x="209" y="130" width="9" height="28" fill="#ec4899"/>
      <rect x="220" y="127" width="11" height="31" fill="#06b6d4"/>
      <!-- Items on Bottom Shelf -->
      <rect x="155" y="175" width="30" height="20" rx="3" fill="#64748b"/>
      <circle cx="225" cy="180" r="8" fill="#84cc16"/>
    
  <!-- Text Label -->
  <text x="200" y="228" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">Minimalist Bookshelf</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="13" fill="#718096" text-anchor="middle">Furniture</text>
</svg>