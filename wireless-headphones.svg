  <rect x="249" y="145" width="26" height="48" rx="10" fill="#2b6cb0"/>
  <rect x="135" y="152" width="14" height="34" rx="6" fill="#cbd5e0"/>
  <rect x="251" y="152" width="14" height="34" rx="6" fill="#cbd5e0"/>
  <!-- Text Label -->
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">Wireless Headphones</text>
  <text x="200" y="248" font-family="Arial, sans-serif" font-size="13" fill="#718096" text-anchor="middle">Electronics</text>
