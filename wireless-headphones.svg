<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0f2f5" stroke="#cccccc" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
  <!-- Headphone Band -->
  <path d="M 140 160 A 60 60 0 0 1 260 160" fill="none" stroke="#4a5568" stroke-width="12" stroke-linecap="round"/>
  <!-- Ear Cups -->
