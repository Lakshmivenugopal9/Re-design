<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0f2f5" stroke="#cccccc" stroke-width="2"/>
  <rect x="20" y="20" width="360" height="260" fill="#ffffff" stroke="#e0e0e0" rx="4"/>
  
      <!-- Backpack Body -->
      <path d="M 155 195 L 155 125 Q 155 75 200 75 Q 245 75 245 125 L 245 195 Z" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
      <!-- Front Pocket -->
      <rect x="165" y="140" width="70" height="50" rx="8" fill="#334155" stroke="#0f172a" stroke-width="2"/>
      <!-- Top Handle -->
      <path d="M 185 75 Q 200 60 215 75" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <!-- Zipper lines -->
      <path d="M 175 148 L 225 148" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>
      <circle cx="200" cy="170" r="5" fill="#f59e0b"/>
    
  <!-- Text Label -->
  <text x="200" y="228" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">Travel Laptop Backpack</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="13" fill="#718096" text-anchor="middle">Accessories</text>
</svg>