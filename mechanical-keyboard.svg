    <rect x="173" y="159" width="18" height="12" rx="2"/>
    <rect x="196" y="159" width="18" height="12" rx="2"/>
    <rect x="219" y="159" width="18" height="12" rx="2"/>
    <rect x="242" y="159" width="38" height="12" rx="2" fill="#3182ce"/>

    <rect x="120" y="176" width="30" height="12" rx="2"/>
    <rect x="155" y="176" width="90" height="12" rx="2" fill="#cbd5e0"/>
    <rect x="250" y="176" width="30" height="12" rx="2"/>
