  <!-- Key rows -->
  <g fill="#4a5568">
    <rect x="120" y="125" width="18" height="12" rx="2"/>
    <rect x="144" y="125" width="18" height="12" rx="2"/>
    <rect x="168" y="125" width="18" height="12" rx="2"/>
    <rect x="192" y="125" width="18" height="12" rx="2"/>
    <rect x="216" y="125" width="18" height="12" rx="2"/>
    <rect x="240" y="125" width="18" height="12" rx="2"/>
    <rect x="264" y="125" width="16" height="12" rx="2" fill="#dd6b20"/>

    <rect x="120" y="142" width="22" height="12" rx="2"/>
    <rect x="147" y="142" width="18" height="12" rx="2"/>
    <rect x="170" y="142" width="18" height="12" rx="2"/>
    <rect x="193" y="142" width="18" height="12" rx="2"/>
    <rect x="216" y="142" width="18" height="12" rx="2"/>
    <rect x="239" y="142" width="18" height="12" rx="2"/>
    <rect x="262" y="142" width="18" height="12" rx="2"/>

    <rect x="120" y="159" width="25" height="12" rx="2"/>
